<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gyaan Setu - AI Tutor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* Header */

        .header {
            background: #2563eb;
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .brand h1 {
            font-size: 22px;
        }

        .brand p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 3px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
        }

        /* Chat */

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f8fafc;
        }

        .welcome {
            max-width: 700px;
            margin: 30px auto;
            text-align: center;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #64748b;
            line-height: 1.6;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 78%;
            padding: 14px 17px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot .bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 5px;
        }

        /* Typing */

        .typing {
            display: none;
            margin-bottom: 18px;
        }

        .typing-bubble {
            display: inline-flex;
            gap: 5px;
            padding: 14px 18px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
        }

        .typing-bubble span {
            width: 7px;
            height: 7px;
            background: #64748b;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing-bubble span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-bubble span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* Input */

        .input-area {
            border-top: 1px solid #e2e8f0;
            background: white;
            padding: 15px 18px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            max-width: 900px;
            margin: auto;
        }

        #chatInput {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 13px 15px;
            font-size: 15px;
            outline: none;
        }

        #chatInput:focus {
            border-color: #2563eb;
        }

        #sendBtn {
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #sendBtn:hover {
            background: #1d4ed8;
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        /* Mobile */

        @media (max-width: 650px) {
            .header {
                padding: 14px 16px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .status {
                font-size: 11px;
            }

            .chat-container {
                padding: 16px;
            }

            .bubble {
                max-width: 90%;
            }

            .welcome h2 {
                font-size: 23px;
            }

            #sendBtn {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                GS
            </div>

            <div>
                <h1>Gyaan Setu</h1>
                <p>Offline AI Learning Assistant</p>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span>AI Online</span>
        </div>

    </header>


    <!-- CHAT -->

    <main id="chatContainer" class="chat-container">

        <div id="welcome" class="welcome">

            <h2>Namaste! 👋</h2>

            <p>
                I'm Gyaan Setu, your AI learning assistant.
                Ask me a question and I'll explain it step by step.
            </p>

        </div>

        <div id="typing" class="typing">

            <div class="typing-bubble">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </main>


    <!-- INPUT -->

    <footer class="input-area">

        <div class="input-wrapper">

            <input
                id="chatInput"
                type="text"
                placeholder="Ask Gyaan Setu a question..."
                autocomplete="off"
            >

            <button id="sendBtn">
                Send
            </button>

        </div>

    </footer>

</div>


<script>

    /*
     * ==========================================
     * GYAAN SETU FRONTEND
     * ==========================================
     *
     * The frontend and backend are served from
     * the same Node.js server.
     *
     * Frontend:
     * http://127.0.0.1:3000
     *
     * API:
     * http://127.0.0.1:3000/api/chat
     *
     */


    // ------------------------------------------
    // API CONFIGURATION
    // ------------------------------------------

    const API_ENDPOINT = "/api/chat";


    // ------------------------------------------
    // ELEMENTS
    // ------------------------------------------

    const chatContainer =
        document.getElementById("chatContainer");

    const chatInput =
        document.getElementById("chatInput");

    const sendBtn =
        document.getElementById("sendBtn");

    const typing =
        document.getElementById("typing");

    const welcome =
        document.getElementById("welcome");


    // ------------------------------------------
    // CONVERSATION HISTORY
    // ------------------------------------------

    const conversationHistory = [];


    // ------------------------------------------
    // SEND MESSAGE TO BACKEND
    // ------------------------------------------

    async function callModel(history) {

        const response = await fetch(API_ENDPOINT, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                messages: history

            })

        });


        if (!response.ok) {

            let errorMessage =
                "Gyaan Setu backend request failed.";

            try {

                const errorData =
                    await response.json();

                if (errorData.error) {
                    errorMessage = errorData.error;
                }

            } catch (error) {
                // Ignore JSON parsing error.
            }

            throw new Error(errorMessage);

        }


        const data =
            await response.json();


        if (!data.reply) {

            throw new Error(
                "The backend returned an empty response."
            );

        }


        return data.reply;

    }


    // ------------------------------------------
    // ADD MESSAGE TO CHAT
    // ------------------------------------------

    function appendMessage(role, text) {

        if (welcome) {
            welcome.style.display = "none";
        }


        const message =
            document.createElement("div");

        message.className =
            "message " + role;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        // textContent is deliberately used instead
        // of innerHTML so model output cannot
        // inject HTML into the page.

        bubble.textContent = text;


        message.appendChild(bubble);

        chatContainer.insertBefore(
            message,
            typing
        );


        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    }


    // ------------------------------------------
    // SHOW TYPING
    // ------------------------------------------

    function showTyping() {

        typing.style.display = "block";

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    }


    // ------------------------------------------
    // HIDE TYPING
    // ------------------------------------------

    function hideTyping() {

        typing.style.display = "none";

    }


    // ------------------------------------------
    // SHOW ERROR
    // ------------------------------------------

    function showError(message) {

        if (welcome) {
            welcome.style.display = "none";
        }


        const errorMessage =
            document.createElement("div");

        errorMessage.className =
            "message bot";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble error";


        bubble.textContent =
            message;


        errorMessage.appendChild(bubble);


        chatContainer.insertBefore(
            errorMessage,
            typing
        );


        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    }


    // ------------------------------------------
    // SEND MESSAGE
    // ------------------------------------------

    async function sendMessage() {

        const text =
            chatInput.value.trim();


        if (!text) {
            return;
        }


        // Display student message.

        appendMessage(
            "user",
            text
        );


        // Add to conversation history.

        conversationHistory.push({

            role: "user",

            content: text

        });


        // Clear input.

        chatInput.value = "";


        // Disable send button.

        sendBtn.disabled = true;


        showTyping();


        try {

            const reply =
                await callModel(
                    conversationHistory
                );


            hideTyping();


            // Display AI response.

            appendMessage(
                "bot",
                reply
            );


            // Save AI response.

            conversationHistory.push({

                role: "assistant",

                content: reply

            });


        } catch (error) {

            hideTyping();


            console.error(
                "Gyaan Setu error:",
                error
            );


            showError(
                error.message ||
                "Gyaan Setu is currently unavailable."
            );

        } finally {

            sendBtn.disabled = false;

            chatInput.focus();

        }

    }


    // ------------------------------------------
    // SEND BUTTON
    // ------------------------------------------

    sendBtn.addEventListener(
        "click",
        sendMessage
    );


    // ------------------------------------------
    // ENTER KEY
    // ------------------------------------------

    chatInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // ------------------------------------------
    // INITIAL FOCUS
    // ------------------------------------------

    chatInput.focus();

</script>

</body>
</html>
